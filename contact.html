<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        input{
            margin: 10px 0;
            padding: 8px 5px;
        }
        select{
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>
            Contact 
        </h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <section>
            <h1>Contact us: </h1>
            <p>Please feel free to ask anything.</p>
        </section>

        <section style="display: grid; grid-template-columns: 100px; margin: 20px;">
            <form>
                <label for="name">
                    <strong>Name: </strong>
                </label>
                <input type="text" id="name" placeholder="Your Name">

                <label for="email">
                   <strong>Email: </strong> 
                </label>
                <input type="email" id="email" placeholder="Enter Your Email">
                <select name="dropdown" id="dropdown">
                    <option value="issue">Issue Related website</option>
                    <option value="account">Account issu</option>
                    <option value="bug">Bugs</option>
                    <option value="feedback">Feedback</option>
                </select>
               <label for="message">
                Message
               </label>
               <textarea style="height: 110px;" name="message" id="message" placeholder="please leave a message for us"></textarea>
               <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    
</body>
</html>
