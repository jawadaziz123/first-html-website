<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <!-- Start header -->
    <header class="head">
        <!-- start logo -->
        <div>
            <div class="logo">
                <img width="50px" src="assets/media/jd-logo-png_seeklogo-170615.png" alt="">
            </div>
        </div>
        <h1 class="web-name">Contact</h1>
        <!-- navebar  -->
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main class="content-main">
        <section>
            <h1>Contact us: </h1>
            <p>Please feel free to ask anything.</p>
        </section>

        <section style="display: grid; grid-template-columns: 100px; margin: 20px;">
            <form class="contact-form">
                <label for="name">
                    <strong>Name: </strong>
                </label>
                <input type="text" id="name" placeholder="Your Name">

                <label for="email">
                   <strong>Email: </strong> 
                </label>
                <input type="email" id="email" placeholder="Enter Your Email">
                <label for="dropdown">
                   <strong>Select: </strong> 
                </label>
                <select name="dropdown" id="dropdown">
                    <option value="issue">Issue Related website</option>
                    <option value="account">Account issu</option>
                    <option value="bug">Bugs</option>
                    <option value="feedback">Feedback</option>
                </select>
               <label for="message">
                <strong>Message: </strong> 
               </label>
               <textarea style="height: 110px;" name="message" id="message" placeholder="please leave a message for us"></textarea>
               <button type="submit" class="submit-btn">Submit</button>
            </form>
        </section>
    </main>
    
</body>
</html>
